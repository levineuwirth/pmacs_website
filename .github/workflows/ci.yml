name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; this installs the stable
      # channel and the directory override selects the pinned one.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Clones pmacs bare and without blobs, and renders every release's docs.
      - run: cargo run --release -- build
      - run: cargo run --release -- check

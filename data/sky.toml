# The vault's sky: the winter zodiac of the Grand Central Terminal ceiling,
# Aquarius to Cancer, with Pegasus, Triangulum and Orion.
#
# Positions are J2000 right ascension (hours) and declination (degrees),
# approximate, with visual magnitude. Right ascension runs left to right,
# as on a celestial globe and on the ceiling, whose sky is mirrored;
# `mirror = true` reflects a figure about its own center, which draws
# Orion the right way round, as the ceiling does.

# patch: the dark patch left uncleaned near Cancer, [ra, dec].
patch = [8.3, 26.5]

[view]
ra0 = 20.4          # right ascension at the left edge, hours
span = 195.0        # degrees of right ascension across the width
dec-top = 38.0
dec-bottom = -24.0
width = 1600.0      # viewBox units; 16:7, the vault's aspect
height = 700.0
field-seed = 1913   # the year the terminal opened
field-count = 9600  # over a wider field, about 2,600 inside the view
light-seed = 42
lit-magnitude = 3.6 # stars this bright or brighter are the lit ones

[[constellation]]
name = "Aquarius"
stars = [
  ["eps", 20.795, -9.50, 3.8], ["beta", 21.526, -5.57, 2.9], ["alpha", 22.096, -0.32, 2.95],
